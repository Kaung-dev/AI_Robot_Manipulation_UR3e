<svg width="100%" viewBox="0 0 780 100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>AI training pipeline — six sequential stages</title>
  <desc>Collect seg data → Train U-Net → Record demos → Mimic augmentation → Train BC → Evaluate</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1 L9 5 L2 9" fill="none" stroke="#9c9a92"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Phase labels -->
  <text x="130" y="13" text-anchor="middle" font-size="10" fill="#aaaaaa"
        font-family="'Google Sans','Noto Sans',sans-serif" letter-spacing="1.5">PERCEPTION</text>
  <text x="390" y="13" text-anchor="middle" font-size="10" fill="#aaaaaa"
        font-family="'Google Sans','Noto Sans',sans-serif" letter-spacing="1.5">DEMONSTRATIONS</text>
  <text x="650" y="13" text-anchor="middle" font-size="10" fill="#aaaaaa"
        font-family="'Google Sans','Noto Sans',sans-serif" letter-spacing="1.5">POLICY</text>

  <!-- Phase divider lines -->
  <line x1="10"  y1="20" x2="250" y2="20" stroke="#85b3eb" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="270" y1="20" x2="510" y2="20" stroke="#5dcaa5" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="530" y1="20" x2="770" y2="20" stroke="#afa9ec" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Boxes: width=110, height=62, y=26 — centers x: 65 195 325 455 585 715, mid-y=57 -->

  <!-- 1. Collect seg data (blue) -->
  <rect x="10"  y="26" width="110" height="62" rx="9" fill="#0c447c" stroke="#85b3eb" stroke-width="0.75"/>
  <text x="65"  y="49" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" font-weight="600" fill="#b5d4f4"
        font-family="'Google Sans','Noto Sans',sans-serif">Collect seg data</text>
  <text x="65"  y="68" text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="#85b3eb"
        font-family="'Google Sans','Noto Sans',sans-serif">160 frames · 40/object</text>

  <line x1="121" y1="57" x2="138" y2="57" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. Train U-Net (blue) -->
  <rect x="140" y="26" width="110" height="62" rx="9" fill="#0c447c" stroke="#85b3eb" stroke-width="0.75"/>
  <text x="195" y="49" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" font-weight="600" fill="#b5d4f4"
        font-family="'Google Sans','Noto Sans',sans-serif">Train U-Net</text>
  <text x="195" y="68" text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="#85b3eb"
        font-family="'Google Sans','Noto Sans',sans-serif">9-class segmentation</text>

  <line x1="251" y1="57" x2="268" y2="57" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Record demos (teal) -->
  <rect x="270" y="26" width="110" height="62" rx="9" fill="#085041" stroke="#5dcaa5" stroke-width="0.75"/>
  <text x="325" y="49" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" font-weight="600" fill="#9fe1cb"
        font-family="'Google Sans','Noto Sans',sans-serif">Record demos</text>
  <text x="325" y="68" text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="#5dcaa5"
        font-family="'Google Sans','Noto Sans',sans-serif">80 demos × 3 objects</text>

  <line x1="381" y1="57" x2="398" y2="57" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. Mimic aug. (teal) -->
  <rect x="400" y="26" width="110" height="62" rx="9" fill="#085041" stroke="#5dcaa5" stroke-width="0.75"/>
  <text x="455" y="49" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" font-weight="600" fill="#9fe1cb"
        font-family="'Google Sans','Noto Sans',sans-serif">Mimic aug.</text>
  <text x="455" y="68" text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="#5dcaa5"
        font-family="'Google Sans','Noto Sans',sans-serif">240 → 3,000+ demos</text>

  <line x1="511" y1="57" x2="528" y2="57" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Train BC (purple) -->
  <rect x="530" y="26" width="110" height="62" rx="9" fill="#3c3489" stroke="#afa9ec" stroke-width="0.75"/>
  <text x="585" y="49" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" font-weight="600" fill="#cecbf6"
        font-family="'Google Sans','Noto Sans',sans-serif">Train BC</text>
  <text x="585" y="68" text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="#afa9ec"
        font-family="'Google Sans','Noto Sans',sans-serif">State → joint actions</text>

  <line x1="641" y1="57" x2="658" y2="57" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. Evaluate (purple) -->
  <rect x="660" y="26" width="110" height="62" rx="9" fill="#3c3489" stroke="#afa9ec" stroke-width="0.75"/>
  <text x="715" y="49" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" font-weight="600" fill="#cecbf6"
        font-family="'Google Sans','Noto Sans',sans-serif">Evaluate</text>
  <text x="715" y="68" text-anchor="middle" dominant-baseline="central"
        font-size="10" fill="#afa9ec"
        font-family="'Google Sans','Noto Sans',sans-serif">Closed-loop rollouts</text>

</svg>
